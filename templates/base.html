<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        GlobalVox RSVP
        {% endblock %}
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


{% comment %} <nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            href="/"
            class="navbar-brand fw-bold"
        >
            GlobalVox RSVP
        </a>

    </div>

</nav> {% endcomment %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a
            href="{% url 'campaigns:home' %}"
            class="navbar-brand fw-bold"
        >
            GlobalVox RSVP
        </a>


        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
        >
            <span class="navbar-toggler-icon"></span>
        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                    <a
                        href="{% url 'campaigns:invitee_list' %}"
                        class="nav-link"
                    >
                        Invitees
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        href="{% url 'campaigns:campaign_list' %}"
                        class="nav-link"
                    >
                        Campaigns
                    </a>

                </li>


                <li class="nav-item">

                    <a
                        href="{% url 'campaigns:campaign_create' %}"
                        class="nav-link"
                    >
                        New Campaign
                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>


<main class="container py-4">

    {% if messages %}

        {% for message in messages %}

            <div
                class="alert alert-{{ message.tags }}"
            >
                {{ message }}
            </div>

        {% endfor %}

    {% endif %}


    {% block content %}

    {% endblock %}

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


{% block javascript %}

{% endblock %}


</body>

</html>
